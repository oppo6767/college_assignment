<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사진 공유 화면</title>
    <link rel="stylesheet" href="css/gallery.css">
</head>
<body>
    <!-- 상단 메뉴 -->
    <header>
        <!--메뉴(현재는 업로드 버튼하고 삭제 버튼)-->
        <div class="galleryMenu">
            <a class="bottonUpload" href="drop-zone.html">업로드</a>
            <button type="button" class="confirm-delete">삭제</button>
        </div>
        <!-- 삭제 -->
         <button type="button" class="del-button">
            <img src="css/image/delete.png" class="img">
         </button>
    </header>
    <!--카테고리 메뉴 나중에 추가할 예정-->
    <div class="galleryCategoryMenu">
        <a class="Category" href="index.html" style="background-image: url('css/image/unknow.jpg'); width: 110px;
    height: 130px;">
            <div class="title">
                <div class="name">카테고리 미설정</div>
            </div>
        </a> <!--나중에 카테고리 추가 예정-->
    </div>
    <!-- 갤러리 공유 화면 예시 -->
    <div class="gallery"></div>
    <!-- 라이트 박스 -->
    <div id="lightbox">
        <img src="" alt="" id="lightboxImage">
        <button type="button" id="closeButton">
            <img src="css/image/delbutton.png" id="img">
        </button>
    </div>
    <script type="module" src="js/gallery.js"></script>
</body>
</html>
